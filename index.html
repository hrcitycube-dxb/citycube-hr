<style>
/* VOICE: calm, exact, a payroll officer's instrument — no decoration, every number traceable to a rule.
   IDEA: the CityCube group console: navy chassis from the CityCube wordmark, each company carried by its own logo.
   PICTURE: the working system itself — live tables, readouts and alerts open at load.
   COLOUR and TYPE: CityCube navy #12305e rail, cool grey ground, CityCube blue #1f7fb5 for actions; night #0e1626. Geist 500 + Geist.
   LAYOUT: left rail of modules, company switch on top, content panels; stacks to a top scroller under 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#eaedf1,#0e1626);--panel:light-dark(#ffffff,#16213a);--panel2:light-dark(#f3f5f8,#1c2945);
--ink:light-dark(#111214,#ececee);--mut:light-dark(#5d6168,#9a9ea6);--line:light-dark(#d3d9e1,#2a3858);
--acc:#1f7fb5;--accInk:light-dark(#17689a,#6cc8e8);--ok:light-dark(#11734b,#4cc38a);--warn:light-dark(#9a5b00,#f0b04a);--bad:light-dark(#b42318,#ff7a6e);
--pri:light-dark(#12305e,#dfe8f5);--priInk:light-dark(#fff,#0e1626);--rail:light-dark(#12305e,#0b1a33);--railInk:#e9eef6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
.offstrip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end}
.od{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}.odb{width:100%;max-width:34px;height:64px;background:var(--panel2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.odb i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0}
.odn{font-weight:600;min-height:16px;font-variant-numeric:tabular-nums}.odl{color:var(--mut);text-align:center;line-height:1.2}.od.we .odb{opacity:.45}.od.td .odl{color:var(--ink);font-weight:600}
@media(max-width:600px){.offstrip{gap:3px}.odl{font-size:10.5px}}
body{padding-top:env(safe-area-inset-top)}
.emp .rail a{justify-content:flex-start;gap:12px}.rail a svg{width:20px;height:20px;flex:none}
.install{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:var(--acc)}
.upl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media(max-width:900px){
 .emp .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;overflow:visible;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -1px 0 #0003}
 .emp .rail a{flex:1;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-size:11.5px;padding:6px 2px;min-height:54px;text-align:center}
 .emp .rail a svg{width:23px;height:23px}
 .emp main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
 .emp .cos .chip{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(max-width:600px){#who{display:none}.emp .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.modal{padding:16px}.ov{padding:2vh 8px}}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center}.nm{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none;background:#fff;border-radius:10px;padding:3px}
.lgbox .mark{width:84px;height:84px;display:block;margin-bottom:14px}
.logo{object-fit:contain;flex:none;vertical-align:middle}.chip .logo{width:26px;height:26px;margin:-3px 6px -3px -6px;background:#fff;border-radius:5px}
.mono{display:inline-grid;place-items:center;border-radius:8px;background:var(--rail);color:#fff;font-weight:600;flex:none}
.cologo{height:84px;display:flex;align-items:center;margin-bottom:10px}.cologo img{max-height:84px;max-width:180px}.cologo .mono{width:64px;height:64px;font-size:22px}
.lgprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lgprev .box{width:120px;height:90px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff}.lgprev .box img{max-width:110px;max-height:80px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.lgbox{width:min(420px,100%);padding:28px}.lgbox h1{margin-bottom:6px}.lgform{display:grid;gap:12px;margin-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:clip}
h1,h2,h3{font-weight:500;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:28px}h2{font-size:19px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--railInk);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:600;font-size:15px;padding:4px 10px 16px;letter-spacing:.01em}.brand small{display:block;font-weight:400;color:#9a9ea6;font-size:12px}
.rail a{color:#c9ccd1;text-decoration:none;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;min-height:40px}
.rail a:hover{background:#ffffff14;color:#fff}.rail a.on{background:#ffffff1f;color:#fff}
.rail a .n{background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.rail .foot{margin-top:auto;font-size:12px;color:#8b8f96;padding:10px}
main{padding:20px clamp(14px,2.6vw,34px) 60px;max-width:1500px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.cos{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:36px;font-size:14px}
.chip.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.banner{background:light-dark(#fff1ea,#3a2216);border:1px solid light-dark(#ffc7ad,#6b3a22);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.banner:empty{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:clamp(20px,2.4vw,27px);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{color:var(--mut);font-size:13px}.kpi.hot b{color:var(--accInk)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.del{color:var(--bad)}a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
#ptab{min-width:1280px}#ptab td:first-child{min-width:200px}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;font-size:16px;width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--acc)}
textarea{min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
label.f.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding-top:20px}
.req::after{content:" *";color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.form .wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0 0 14px}
legend{padding:0 6px;font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12.5px;border-bottom:1px solid var(--line);padding:8px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-top:2px solid var(--ink)}
td input{min-height:34px;padding:4px 6px;font-size:14px;width:78px;text-align:right}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.acc{color:var(--accInk);border-color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.alerts li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alerts{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:14px}.dl dt{color:var(--mut)}.dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.dl .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--panel);border-radius:14px;width:min(980px,100%);padding:20px 22px;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.law td:first-child{white-space:nowrap;font-weight:500}
.warnl{color:var(--bad);font-size:13px}
.pill{font-variant-numeric:tabular-nums}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:20;gap:2px}.brand,.rail .foot{display:none}.rail a{flex:none;padding:8px 12px}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<section id="login" class="login" hidden>
  <div class="lgbox panel">
    <img class="mark" src="logos/citycube-mark.png" alt="CityCube">
    <h1>CityCube Group HR</h1>
    <p class="small mut">Sign in with the username and password given to you by HR.</p>
    <form id="lgForm" class="lgform">
      <label class="f">Username or email<input id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="f">Password<input id="lgPass" type="password" autocomplete="current-password" required></label>
      <button class="btn pri" id="lgBtn" type="submit">Sign in</button>
      <button class="btn" id="lgForgot" type="button">Forgot password?</button>
    </form>
    <p id="lgMsg" class="small" role="status"></p>
  </div>
</section>
<div class="app" id="app" hidden>
  <nav class="rail" id="rail"></nav>
  <main>
    <div class="top">
      <div class="cos" id="cos"></div>
      <div class="row"><span class="small mut" id="who"></span><button class="btn sm" data-act="logout">Sign out</button></div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="view"><div class="empty">Loading HR data…</div></div>
  </main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<datalist id="nats"><option>United Arab Emirates</option><option>India</option><option>Pakistan</option><option>Philippines</option><option>Bangladesh</option><option>Nepal</option><option>Sri Lanka</option><option>Egypt</option><option>Jordan</option><option>Syria</option><option>Lebanon</option><option>Sudan</option><option>Morocco</option><option>Tunisia</option><option>Kenya</option><option>Uganda</option><option>Nigeria</option><option>Ghana</option><option>Ethiopia</option><option>Indonesia</option><option>China</option><option>United Kingdom</option><option>Saudi Arabia</option><option>Oman</option><option>Bahrain</option><option>Kuwait</option><option>Qatar</option></datalist>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,terminate,clearIndexedDbPersistence,collection,doc,setDoc,deleteDoc,getDoc,getDocs,onSnapshot,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig,LOGIN_DOMAIN,APP_NAME} from './firebase-config.js';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=s=>{if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);return new Date(Date.UTC(y,(m||1)-1,d||1))};
const iso=d=>d.toISOString().slice(0,10);
const today=()=>{const n=new Date();return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())))};
const addD=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const addM=(s,n)=>{const d=D(s);const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const dim=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,dim));return iso(d)};
const diff=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fmtD=s=>s?D(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}):'—';
const r2=n=>Math.round((+n||0)*100)/100;
const aed=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const aed0=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const curMonth=()=>today().slice(0,7);
const monthName=m=>{const d=D(m+'-01');return d.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})};
const dim=m=>{const[y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).getUTCDate()};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const GCC=['united arab emirates','uae','emirati','saudi arabia','oman','bahrain','kuwait','qatar'];
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}

/* ---------- state & Firebase ---------- */
const COLS=['companies','employees','leaves','payruns','loans','settlements','settings','users','payslips','files'];
const BLOBS=['photos','fileChunks'];
const S={};COLS.forEach(c=>S[c]={});
const DEF={otNormal:25,otNight:50,otRest:50,hourBase:'basic',hourDiv:30,hoursDay:8,alertDays:60,annualBasis:'cal',penEE:11,penER:15,penGov:2.5,penCap:70000,penMin:3000,holidays:[]};
const ST=()=>Object.assign({},DEF,S.settings.main||{});
let CO=(()=>{try{return localStorage.getItem('hr-co')||'all'}catch(e){return 'all'}})();
function setCO(v){CO=v;try{localStorage.setItem('hr-co',v)}catch(e){}render()}
const clean=o=>JSON.parse(JSON.stringify(o));
const CONFIGURED=!!(firebaseConfig&&firebaseConfig.apiKey&&firebaseConfig.projectId&&!/YOUR_/.test(firebaseConfig.apiKey));
let fbApp=null,auth=null,fdb=null;
const STANDALONE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
if(CONFIGURED){fbApp=initializeApp(firebaseConfig);auth=getAuth(fbApp);
  try{fdb=STANDALONE?initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}):getFirestore(fbApp)}catch(e){fdb=getFirestore(fbApp)}}
let ME=null,unsubs=[],lgNote='';
const isAdmin=()=>!!ME&&ME.role==='admin';
const errMsg=e=>({'permission-denied':'you do not have permission for this','unavailable':'no connection to the database — check the internet connection'}[e&&e.code]||((e&&(e.code||e.message))||'error'));
const offline=()=>{if(navigator.onLine===false){toast('You\u2019re offline. Connect to the internet and try again.');return true}return false};
async function put(c,obj){if(offline())throw new Error('offline');obj.updatedAt=new Date().toISOString();try{await setDoc(doc(fdb,c,obj.id),clean(obj))}catch(e){toast('Save failed: '+errMsg(e));throw e}}
async function del(c,id){try{await deleteDoc(doc(fdb,c,id))}catch(e){toast('Delete failed: '+errMsg(e));throw e}}
function setBanner(t){$('#banner').textContent=t}
function sub(c,ref){
  unsubs.push(onSnapshot(ref,snap=>{
    if('docs' in snap){const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},d.data(),{id:d.id})});S[c]=o}
    else S[c]=snap.exists()?{[snap.id]:Object.assign({},snap.data(),{id:snap.id})}:{};
    schedule();
  },err=>{setBanner('Could not load '+c+': '+errMsg(err));schedule()}));
}
function startAdmin(){['companies','employees','leaves','payruns','loans','settlements','settings','users','files'].forEach(c=>sub(c,collection(fdb,c)))}
function startEmp(){
  sub('companies',collection(fdb,'companies'));sub('settings',collection(fdb,'settings'));
  sub('employees',doc(fdb,'employees',ME.empId));
  sub('leaves',query(collection(fdb,'leaves'),where('empId','==',ME.empId)));
  sub('payslips',query(collection(fdb,'payslips'),where('empId','==',ME.empId)));
  sub('files',query(collection(fdb,'files'),where('empId','==',ME.empId)));
}
const userEmail=u=>{u=String(u||'').trim().toLowerCase();return u.includes('@')?u:u+'@'+LOGIN_DOMAIN};
const userName=em=>{em=String(em||'');return em.endsWith('@'+LOGIN_DOMAIN)?em.slice(0,-(LOGIN_DOMAIN.length+1)):em};
function showLogin(msg){$('#app').hidden=true;$('#login').hidden=false;$('#lgMsg').textContent=msg||'';
  if(!CONFIGURED){$('#lgForm').hidden=true;$('#lgMsg').textContent='Firebase is not configured yet. Fill in firebase-config.js — see README.md.'}}
function showApp(){$('#login').hidden=true;$('#app').hidden=false}

  parental:{n:'Parental leave (5 working days)',pay:'full',basis:'work',max:5,art:'Art. 32'},
  bereave:{n:'Bereavement (5 spouse / 3 family)',pay:'full',max:5,art:'Art. 32'},
  study:{n:'Study leave (10 working days)',pay:'full',basis:'work',max:10,art:'Art. 32'},
  national:{n:'National service (UAE nationals)',pay:'full',art:'Art. 32'},

  unpaid:{n:'Unpaid leave',pay:'none',excl:1,art:'Art. 33'},

const gross=e=>num(e.basic)+num(e.housing)+num(e.transport)+num(e.otherAllow);
const coOf=e=>S.companies[e.companyId]||{};
const isOff=(d,co)=>{const wk=co.weekend||[0,6];if(wk.includes(D(d).getUTCDay()))return true;return ST().holidays.some(h=>h.date===d)};
function leaveDates(l){const o=[];if(!l.from||!l.to||l.to<l.from)return o;for(let d=l.from;d<=l.to;d=addD(d,1))o.push(d);return o}
function counted(l,e){const t=LT[l.type]||{};const work=t.basis==='work'||(l.type==='annual'&&ST().annualBasis==='work');const co=coOf(e);return leaveDates(l).filter(d=>!work||!isOff(d,co))}
const probMonths=e=>{const v=e.probation;return v===''||v==null?6:Math.min(6,Math.max(0,num(v)))};
const probEnd=e=>e.join?addM(e.join,probMonths(e)):null;
const inProb=(e,d)=>e.join&&d<probEnd(e);
const svcYear=(e,d)=>Math.floor(diff(e.join,d)/365);
let FR={},FRv=0,Sv=0;
function fracs(empId){
  if(FRv!==Sv){FR={};FRv=Sv}
  if(FR[empId])return FR[empId];
  const e=S.employees[empId]||{},m={},sick={};
  const ls=Object.values(S.leaves).filter(l=>l.empId===empId&&l.status==='approved').sort((a,b)=>a.from<b.from?-1:1);
  for(const l of ls){const t=LT[l.type]||{pay:'full'};
    counted(l,e).forEach((d,i)=>{let f=1;
      if(t.pay==='none')f=0;
      else if(t.pay==='mat')f=i<45?1:i<60?.5:0;
      else if(t.pay==='sick'){if(inProb(e,d))f=0;else{const y=svcYear(e,d);const n=sick[y]=(sick[y]||0)+1;f=n<=15?1:n<=45?.5:0}}
      m[d]={f,type:l.type,excl:!!t.excl};});
  }
  return FR[empId]=m;
}
function exclDays(e,asOf){const m=fracs(e.id);let n=0;for(const d in m)if(m[d].excl&&d<=asOf&&d>=e.join)n++;return n}
function netService(e,asOf){if(!e.join||asOf<e.join)return 0;return diff(e.join,asOf)+1-exclDays(e,asOf)}
function gratuity(e,asOf){
  const basic=num(e.basic),nd=netService(e,asOf),y=nd/365,daily=basic/30;
  if(e.pension)return{amt:0,y,daily,note:'Pension-covered national: GPSSA contributions apply instead of gratuity.'};
  if(nd<365)return{amt:0,y,daily,note:'Under 1 year of continuous service: no gratuity (Art. 51).'};
  let g=daily*(21*Math.min(y,5)+30*Math.max(y-5,0));const cap=basic*24,capped=g>cap;g=Math.min(g,cap);
  let note=`21 days' basic × first 5 yrs${y>5?' + 30 days × '+(y-5).toFixed(2)+' yrs':''}; ${y.toFixed(2)} yrs net service.`;
  if(e.empType==='part')note+=' Part-time: pro-rate by contracted hours.';
  if(capped)note+=' Capped at 2 years’ wage.';
  return{amt:r2(g),y,daily,note,capped};
}
function annualBal(e,asOf){
  const ent=num(e.annualEnt)||30,F=x=>{const nd=netService(e,x),mo=nd/30.4375;return mo<6?0:mo<12?2*Math.floor(mo):ent*nd/365};
  const od=e.leaveOpenDate&&e.leaveOpenDate>=(e.join||'')?e.leaveOpenDate:'',months=netService(e,asOf)/30.4375;
  const acc=od?num(e.leaveOpen)+(asOf>od?F(asOf)-F(od):0):F(asOf);
  let taken=0,booked=0;
  Object.values(S.leaves).forEach(l=>{if(l.empId!==e.id||l.type!=='annual'||l.status!=='approved')return;const c=counted(l,e).filter(d=>!od||d>od);taken+=c.filter(d=>d<=asOf).length;booked+=c.filter(d=>d>asOf).length});
  const adj=num(e.leaveAdj);
  return{acc:Math.round(acc*10)/10,taken,booked,adj,od,bal:Math.round((acc-taken-booked+adj)*10)/10,earlyNote:months<6?'Annual leave is earned only after 6 months of service.':(!od&&months>12?'No go-live leave balance set, so leave is counted from the joining date with no leave taken before this system. Set it in Edit → Salary & bank.':'')};
}
function sickUsed(e,asOf){const m=fracs(e.id),y=svcYear(e,asOf);let n=0;for(const d in m)if(m[d].type==='sick'&&svcYear(e,d)===y)n++;return n}
function loanRepaid(id){
  let r=0;Object.values(S.payruns).forEach(p=>{if(p.status!=='final')return;(p.lines||[]).forEach(L=>{r+=num((L.loanParts||{})[id])})});
  Object.values(S.settlements).forEach(s=>{r+=num((s.loanParts||{})[id])});
  return r+num((S.loans[id]||{}).manualRepaid);
}
const loanBal=l=>r2(num(l.amount)-loanRepaid(l.id));
function loansFor(empId,month){return Object.values(S.loans).filter(l=>l.empId===empId&&(!l.startMonth||l.startMonth<=month)&&loanBal(l)>0.005).sort((a,b)=>(a.startMonth||'')<(b.startMonth||'')?-1:1)}
function autoLoan(empId,month){return r2(loansFor(empId,month).reduce((s,l)=>s+Math.min(num(l.installment),loanBal(l)),0))}
function splitLoan(empId,month,amt){const o={};let left=amt;for(const l of loansFor(empId,month)){if(left<=0)break;const a=Math.min(left,loanBal(l));o[l.id]=r2(a);left-=a}return o}

function payLine(e,month,inp){
  inp=inp||{};const st=ST(),n=dim(month),start=month+'-01',end=month+'-'+String(n).padStart(2,'0');
  if(!e.join)return null;
  const s=e.join>start?e.join:start,en=e.exitDate&&e.exitDate<end?e.exitDate:end;if(s>en)return null;
  const days=diff(s,en)+1,g=gross(e),daily=g/n,fixed=g*days/n,fr=fracs(e.id);
  let leaveDed=0,unpaid=0,leaveDays=0;
  for(let d=s;d<=en;d=addD(d,1))if(fr[d]){leaveDays++;leaveDed+=(1-fr[d].f)*daily;unpaid+=1-fr[d].f}
  const hb=(st.hourBase==='gross'?g:num(e.basic))/num(st.hourDiv||30)/num(st.hoursDay||8);
  const otH=num(inp.otN)+num(inp.otNight)+num(inp.otRest);
  const ot=hb*(num(inp.otN)*(1+st.otNormal/100)+num(inp.otNight)*(1+st.otNight/100)+num(inp.otRest)*(1+st.otRest/100));
  const add=num(inp.bonus)+num(inp.otherAdd);
  const loan=inp.loanDed!==undefined&&inp.loanDed!==''?num(inp.loanDed):autoLoan(e.id,month);
  const oth=num(inp.otherDed);
  const pb=Math.min(st.penCap,Math.max(st.penMin,num(e.pensionSalary)||g));
  const penEE=e.pension?pb*st.penEE/100:0,penER=e.pension?pb*(st.penER-(pb<20000?st.penGov:0))/100:0;
  const wage=fixed-leaveDed,earn=wage+ot+add,ded=loan+oth+penEE,net=earn-ded;
  const w=[];
  if(loan+oth>0.5*wage+0.01)w.push('Deductions exceed 50% of wage (Art. 25)');
  if(num(inp.otN)+num(inp.otNight)>2*days)w.push('Overtime above 2 h/day average (Art. 19)');
  if(e.payMethod!=='cash'&&!e.iban)w.push('No IBAN for WPS');
  if(net<0)w.push('Net pay is negative');
  return{empId:e.id,code:e.code||'',name:e.name,days,gross:r2(g),fixed:r2(fixed),leaveDays,unpaid:r2(unpaid),leaveDed:r2(leaveDed),otH,ot:r2(ot),add:r2(add),loan:r2(loan),oth:r2(oth),penEE:r2(penEE),penER:r2(penER),earn:r2(earn),ded:r2(ded),net:r2(net),cost:r2(earn+penER),w,from:s,to:en,
    iban:e.iban||'',routing:e.routing||'',personId:e.personId||'',payMethod:e.payMethod||'wps'};
}

const DOCREQ=[['Passport','passportNo','passportExp',1],['Residence visa','visaNo','visaExp',0],['Emirates ID','eidNo','eidExp',1],['Work permit','permitNo','permitExp',0],['Health insurance','insurer','insExp',0],['ILOE insurance','','iloeExp',0],['Contract end date','','contractEnd',1]];
function docStatus(e){const t=today(),win=num(ST().alertDays)||60,r={expired:[],due:[],missing:[]};
  DOCREQ.forEach(([n,no,ex,all])=>{if(!all&&e.pension)return;const x=e[ex];
    const hasNo=!no||!!e[no];if(!x||!hasNo){r.missing.push(!x&&!hasNo?n:!x?(no?n+' expiry':n):n+' number');return}
    const d=diff(t,x);if(d<0)r.expired.push(n);else if(d<=win)r.due.push(n)});
  return r}
function docTag(e){const s=docStatus(e),tip=[s.expired.length&&'Expired: '+s.expired.join(', '),s.due.length&&'Due soon: '+s.due.join(', '),s.missing.length&&'Missing: '+s.missing.join(', ')].filter(Boolean).join(' · ');
  const t=s.expired.length?`<span class="tag bad">${s.expired.length} expired</span>`:s.due.length?`<span class="tag acc">${s.due.length} due</span>`:'';
  const m=s.missing.length?`<span class="tag warn">${s.missing.length} missing</span>`:'';
  return`<span class="row" style="gap:4px" title="${esc(tip)}">${t}${m}${!t&&!m?'<span class="tag ok">Complete</span>':''}</span>`}
const DOCS=[['passportExp','Passport'],['visaExp','Residence visa'],['eidExp','Emirates ID'],['permitExp','Work permit'],['insExp','Health insurance'],['iloeExp','ILOE insurance'],['contractEnd','Contract']];
function alerts(){
  const t=today(),win=num(ST().alertDays)||60,out=[];
  emps().filter(e=>e.status!=='exited').forEach(e=>{
    DOCS.forEach(([k,n])=>{if(!e[k])return;const d=diff(t,e[k]);if(d<=win)out.push({d,who:e.name,what:n,date:e[k],co:e.companyId,emp:e.id})});
    if(e.join){const pe=probEnd(e),d=diff(t,pe);if(d>=0&&d<=30)out.push({d,who:e.name,what:'Probation ends',date:pe,co:e.companyId,emp:e.id,info:1})}
    const ms=docStatus(e).missing;if(ms.length)out.push({d:9999,who:e.name,what:'Missing: '+ms.join(', '),co:e.companyId,emp:e.id,info:1});
  });
  Object.values(S.companies).forEach(c=>{[['licenseExp','Trade licence'],['estExp','Establishment card']].forEach(([k,n])=>{if(!c[k])return;const d=diff(t,c[k]);if(d<=win)out.push({d,who:c.short||c.name,what:n,date:c[k],co:c.id})})});
  if(isAdmin())Object.values(S.files).filter(f=>f.status==='review').forEach(f=>{const e=S.employees[f.empId]||{};out.push({d:-99999,review:1,who:e.name||'',what:'New '+((DT[f.docType]||{n:'document'}).n).toLowerCase()+' to check',co:e.companyId,emp:f.empId})});
  return out.filter(a=>CO==='all'||a.co===CO).sort((a,b)=>a.d-b.d);
}

function field([k,l,t='text',req],v){

  if(t==='area')return`<label class="f wide">${lab}<textarea id="${id}" data-k="${k}">${esc(v)}</textarea></label>`;
  if(t==='co')return`<label class="f">${lab}<select id="${id}" data-k="${k}">${cos().map(c=>`<option value="${esc(c.id)}" ${c.id===v?'selected':''}>${esc(c.short||c.name)}</option>`).join('')}</select></label>`;
  if(t==='week'){const w=Array.isArray(v)?v:[0,6];return`<div class="f wide"><span class="small mut">${esc(l)}</span><div class="row" data-k="${k}" data-week>${DAYS.map((d,i)=>`<label class="row small"><input type="checkbox" value="${i}" ${w.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>`}
  if(t.startsWith('sel:'))return`<label class="f">${lab}<select id="${id}" data-k="${k}">${t.slice(4).split(',').map(o=>{const[a,b]=o.includes(':')?o.split(':'):[o,o||'—'];return`<option value="${esc(a)}" ${String(v)===a?'selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;

function download(filename,data){
  try{const b=new Blob([data],{type:/\.html$/.test(filename)?'text/html':'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

}

/* Who's off */
let DW=30;
function whosOff(es){
  const t=today(),end=addD(t,DW),ids=new Set(es.map(e=>e.id));
  const ls=Object.values(S.leaves).filter(l=>ids.has(l.empId)&&['approved','pending'].includes(l.status)&&l.to>=t&&l.from<=end).sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:a.to<b.to?-1:1);
  const now=ls.filter(l=>l.from<=t),soon=ls.filter(l=>l.from>t);
  const days=Array.from({length:14},(_,i)=>addD(t,i));
  const cnt=days.map(d=>Object.values(S.leaves).filter(l=>ids.has(l.empId)&&l.status==='approved'&&l.from<=d&&l.to>=d).length),mx=Math.max(1,...cnt);
  const wk=d=>{const co=CO!=='all'?S.companies[CO]:null;return co?isOff(d,co):[0,6].includes(D(d).getUTCDay())};
  const row=l=>{const e=S.employees[l.empId]||{},n=counted(l,e).length;return`<li><span class="nm">${avatar(e,34)}<span><b>${esc(e.name)}</b><div class="small mut">${esc([coName(e.companyId),e.department].filter(Boolean).join(' · '))}</div></span></span><span class="row" style="gap:8px;justify-content:flex-end"><span class="tag">${esc((LT[l.type]||{n:l.type}).n)}</span><span class="small pill">${fmtD(l.from)} – ${fmtD(l.to)} · ${n} d · back ${fmtD(backDate(l,e))}</span>${l.status==='pending'?`${stTag('pending')}<button class="btn sm pri" data-act="leaveReview" data-id="${esc(l.id)}">Review</button>`:''}</span></li>`};
  return`<div class="panel"><div class="ph"><h2>Who’s off</h2><div class="row">${[7,30,90].map(n=>`<button class="chip ${DW===n?'on':''}" data-act="dw" data-n="${n}">Next ${n} days</button>`).join('')}</div></div>
  <div class="offstrip" aria-label="People on approved leave, next 14 days">${days.map((d,i)=>`<div class="od ${wk(d)?'we':''} ${i===0?'td':''}" title="${fmtD(d)}: ${cnt[i]} off"><span class="odn">${cnt[i]||''}</span><span class="odb"><i style="height:${cnt[i]/mx*100}%"></i></span><span class="odl">${D(d).toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}).slice(0,2)}<br>${D(d).getUTCDate()}</span></div>`).join('')}</div>
  <div class="grid g2" style="margin-top:14px"><div><h3 style="margin-bottom:6px">On leave now <span class="mut">(${now.length})</span></h3>${now.length?`<ul class="alerts">${now.map(row).join('')}</ul>`:'<p class="small mut">Nobody is on leave today.</p>'}</div>
  <div><h3 style="margin-bottom:6px">Starting in the next ${DW} days <span class="mut">(${soon.length})</span></h3>${soon.length?`<ul class="alerts">${soon.map(row).join('')}</ul>`:'<p class="small mut">No leave booked in this period.</p>'}</div></div>
  <p class="small mut" style="margin-top:8px">Bars count approved leave per day; pending requests are listed with a Review button.</p></div>`;
}

/* CSV */
const CSVK=['code','name','company','nationality','gender','dob','phone','email','designation','department','empType','join','contractEnd','probation','notice','basic','housing','transport','otherAllow','annualEnt','leaveOpen','leaveOpenDate','leaveAdj','payMethod','bank','iban','routing','personId','pension','passportNo','passportExp','visaNo','visaExp','eidNo','eidExp','permitNo','permitExp','insurer','insExp','iloeExp'];
const csvCell=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>String(v).trim()))}
ACT.csvExport=()=>{const rows=[CSVK.join(',')].concat(visEmps().map(e=>CSVK.map(k=>csvCell(k==='company'?coName(e.companyId):e[k])).join(',')));download('employees-'+today()+'.csv',rows.join('\n'))};
ACT.csvImport=()=>{
  openModal('Import employees from CSV',`<p class="small">First row must hold column names. Use the short company name (${cos().map(c=>esc(c.short||c.name)).join(', ')}) in the <b>company</b> column. Dates as YYYY-MM-DD. Rows whose employee no. already exists update that employee.</p>
  <div class="row"><button class="btn sm" id="tplCopy">Copy template header</button></div><p class="small mut" style="word-break:break-all">${esc(CSVK.join(','))}</p>
  <label class="f">CSV file<input type="file" id="csvF" accept=".csv,text/csv"></label><p class="small mut">Or paste CSV text:</p><textarea id="csvT" style="min-height:140px"></textarea><div id="csvR" class="small"></div>`,
  `<button class="btn" data-act="close">Cancel</button><button class="btn pri" id="csvGo">Import</button>`);
  $('#tplCopy').onclick=async()=>{try{await navigator.clipboard.writeText(CSVK.join(','));toast('Template copied')}catch(e){toast('Copy not allowed here')}};
  $('#csvF').onchange=async e=>{const f=e.target.files[0];if(f)$('#csvT').value=await f.text()};
  $('#csvGo').onclick=async()=>{
    const rows=parseCSV($('#csvT').value);if(rows.length<2){$('#csvR').textContent='No data rows found.';return}
    const h=rows[0].map(x=>x.trim());let ok=0,bad=[];
    for(const[i,r]of rows.slice(1).entries()){const o={};h.forEach((k,j)=>{if(CSVK.includes(k))o[k]=(r[j]??'').trim()});
      const c=cos().find(c=>[c.short,c.name,c.id].map(x=>String(x||'').toLowerCase()).includes(String(o.company||'').toLowerCase()))||(CO!=='all'?S.companies[CO]:null);
      if(!o.name||!c){bad.push(i+2);continue}
      const ex=o.code&&emps().find(e=>e.code===o.code&&e.companyId===c.id);
      const v=Object.assign(ex?clean(ex):{id:uid(),status:'active',empType:'full',probation:6,notice:30,annualEnt:30,payMethod:'wps',created:today()},o);
      delete v.company;v.companyId=c.id;['basic','housing','transport','otherAllow','annualEnt','leaveOpen','leaveAdj','probation','notice'].forEach(k=>{if(v[k]!==''&&v[k]!=null)v[k]=num(v[k])});
      v.pension=/^(1|y|yes|true)$/i.test(String(o.pension||''))||(!ex&&GCC.includes(String(v.nationality||'').toLowerCase()));
      if(v.iban)v.iban=v.iban.replace(/\s/g,'').toUpperCase();
      try{await put('employees',v);ok++}catch(x){bad.push(i+2)}}
    $('#csvR').innerHTML=`<b>${ok}</b> imported.${bad.length?' Skipped rows (missing name or unknown company): '+bad.join(', '):''}`;
  };
};

function payPreview(l,e){
  const t=LT[l.type]||{};const c=counted(l,e);if(!c.length)return'—';

  return[f&&f+' full',h&&h+' half',u&&u+' unpaid'].filter(Boolean).join(', ');
}

function draftInputs(id){if(!PD[id]){const r=S.payruns[id];PD[id]=r?clean(r.inputs||{}):{}}return PD[id]}
function runLines(c,m){const id=runId(c,m),r=S.payruns[id];if(r&&r.status==='final')return r.lines||[];const inp=draftInputs(id);return emps().filter(e=>e.companyId===c).map(e=>payLine(e,m,inp[e.id])).filter(Boolean)}
const sumL=(L,k)=>r2(L.reduce((s,x)=>s+num(x[k]),0));

    ${CO==='all'?`<select id="pco" style="width:auto">${cos().map(x=>`<option value="${esc(x.id)}" ${x.id===c?'selected':''}>${esc(x.short||x.name)}</option>`).join('')}</select>`:''}

   <div class="row">${fin?`<button class="btn" data-act="payReopen">Reopen</button><button class="btn" data-act="paySif">WPS SIF file</button><button class="btn" data-act="payCsv">Register CSV</button><button class="btn" data-act="slipAll">All payslips</button>`:`<button class="btn" data-act="paySave">Save draft</button><button class="btn acc" data-act="payFinal" ${L.length?'':'disabled'}>Finalise payroll</button>`}</div></div>

   ${L.map(x=>{const i=(fin?(r.inputs||{}):inp)[x.empId]||{};const ro=k=>`<td class="num">${esc(i[k]||'')}</td>`;return`<tr data-row="${esc(x.empId)}"><td><b>${esc(x.name)}</b><div class="small mut">${esc(x.code)}${x.w.length?` · <span class="warnl" title="${esc(x.w.join('; '))}">${esc(x.w[0])}${x.w.length>1?' +'+(x.w.length-1):''}</span>`:''}</div></td><td class="num">${x.days}</td><td class="num">${aed(x.fixed)}</td><td class="num">${x.leaveDed?aed(x.leaveDed):'—'}</td>

/* End of service */
const REASONS={resign:'Resignation by employee',term:'Termination by employer (with notice)',expiry:'Contract expiry / non-renewal',mutual:'Mutual agreement',art44:'Dismissal without notice (Art. 44)',probEr:'Employer ends during probation',probEe:'Employee leaves during probation',death:'Death or permanent disability'};
let SE={emp:'',last:today(),reason:'resign',served:'',ticket:0,otherAdd:0,otherDed:0,note:''};
ACT.goSettle=d=>{SE.emp=d.id;closeModal()};
function settle(){
  const e=S.employees[SE.emp];if(!e)return null;const last=SE.last||today(),g=gross(e),basic=num(e.basic);
  const gr=gratuity(e,last),lb=annualBal(e,last);
  const prob=inProb(e,last),req=SE.reason==='probEr'||SE.reason==='probEe'?14:(num(e.notice)||30),served=SE.served===''?req:num(SE.served),short=Math.max(0,req-served);
  let notice=0,noticeNote='';
  if(['term','probEr'].includes(SE.reason)){notice=short*g/30;noticeNote=short?`Employer pays ${short} unserved notice day(s) at full wage (Art. 43).`:'Notice fully served.'}
  else if(['resign','probEe'].includes(SE.reason)){notice=-short*g/30;noticeNote=short?`Employee owes ${short} unserved notice day(s) (Art. 43).`:'Notice fully served.'}
  else noticeNote=SE.reason==='art44'?'No notice due on lawful dismissal under Art. 44; gratuity remains payable.':'No notice pay applies.';
  const m=last.slice(0,7),paid=Object.values(S.payruns).some(p=>p.status==='final'&&p.companyId===e.companyId&&p.month===m&&(p.lines||[]).some(L=>L.empId===e.id));
  const part=(payLine(Object.assign({},e,{exitDate:last}),m,{loanDed:0})||{earn:0}).earn,full=(payLine(Object.assign({},e,{exitDate:''}),m,{loanDed:0})||{earn:0}).earn;
  const sal=paid?-(full-part):part;
  const leaveEnc=lb.bal*basic/30;
  const loans=Object.values(S.loans).filter(l=>l.empId===e.id&&loanBal(l)>0),loanTot=r2(loans.reduce((s,l)=>s+loanBal(l),0)),loanParts={};loans.forEach(l=>loanParts[l.id]=loanBal(l));
  const items=[[paid?'Salary paid in '+monthName(m)+' payroll for days after last working day':'Salary for '+monthName(m)+' to last day',sal],['Annual leave '+(lb.bal>=0?'encashment':'taken in advance')+` (${lb.bal} d × basic ÷ 30)`,leaveEnc],['End-of-service gratuity',gr.amt],['Notice period',notice],['Repatriation ticket',num(SE.ticket)],['Other additions',num(SE.otherAdd)],['Loan / advance balance recovered',-loanTot],['Other deductions'+(SE.note?' — '+SE.note:''),-num(SE.otherDed)]];
  const total=r2(items.reduce((s,x)=>s+x[1],0));
  return{e,last,gr,lb,items,total,noticeNote,loanParts,prob,payBy:addD(last,14)};
}

};

const CHUNK=900000,MAXF=5*1024*1024;
const fileList=empId=>Object.values(S.files).filter(f=>f.empId===empId).sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')));
const localDay=v=>{const x=new Date(v);return isNaN(x)?'':iso(new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())))};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round((n||0)/1024))+' KB';
const avatar=(e,s)=>e&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(e.thumb||'')?`<img class="av" src="${e.thumb}" style="width:${s}px;height:${s}px" alt="">`:`<span class="av mono" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.38)}px">${esc(initials({short:(e&&e.name)||'?'}))}</span>`;
function readAsDataURL(blob){return new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>j(new Error('Could not read the file.'));f.readAsDataURL(blob)})}
function loadImg(file){return new Promise((r,j)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{r(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>j(new Error('This image format can’t be read here. Save it as JPG, PNG or PDF and try again.'));i.src=u})}
function drawJpeg(img,max,q,square){let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=w=h=m}
  const k=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',q)}
async function prepFile(file){
  if(/^image\//.test(file.type)&&!/svg/.test(file.type)){const img=await loadImg(file);let d=drawJpeg(img,2000,.82);if(d.length>1.6e6)d=drawJpeg(img,1600,.72);return{mime:'image/jpeg',data:d.split(',')[1]}}
  if(file.size>MAXF)throw new Error(`This file is ${kb(file.size)}; the limit is 5 MB. Compress the PDF or scan at a lower resolution, then try again.`);
  const d=await readAsDataURL(file);return{mime:file.type||'application/octet-stream',data:d.split(',')[1]||''}}
async function saveFile(meta,file){
  const p=await prepFile(file),n=Math.max(1,Math.ceil(p.data.length/CHUNK));
  if(n>8)throw new Error('This file is too large after conversion. Use a smaller scan.');
  const id=uid(),m=Object.assign({},meta,{id,mime:p.mime,size:Math.round(p.data.length*3/4),chunks:n,name:String(file.name||'file').slice(0,120),created:new Date().toISOString(),uploadedBy:ME.uid,byRole:ME.role==='admin'?'admin':'employee'});
  for(let i=0;i<n;i++)await put('fileChunks',{id:id+'_'+i,fileId:id,empId:m.empId,i,data:p.data.slice(i*CHUNK,(i+1)*CHUNK)});
  await put('files',m);return m;
}

/* ---------- shared leave logic ---------- */
const LEAVE_TYPES=['annual','sick','unpaid','maternity','comp'];
const canTake=(k,e)=>k!=='maternity'||(!!e&&e.gender==='Female'&&e.marital==='Married');
const typeOpts=(e,sel)=>LEAVE_TYPES.filter(k=>canTake(k,e)||k===sel).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${esc(LT[k].n)}</option>`).join('')+(sel&&!LEAVE_TYPES.includes(sel)&&LT[sel]?`<option value="${sel}" selected>${esc(LT[sel].n)} (old type)</option>`:'');
function compBal(e,excl){const cr=(e.compCredits||[]).reduce((a,c)=>a+num(c.days),0);let used=0;
  Object.values(S.leaves).forEach(l=>{if(l.empId===e.id&&l.type==='comp'&&l.id!==excl&&['approved','pending'].includes(l.status))used+=counted(l,e).length});
  return{cr:r2(cr),used,bal:r2(cr-used)}}
function backDate(v,e){const co=coOf(e);let d=addD(v.to,1),n=0;while(isOff(d,co)&&n++<14)d=addD(d,1);return d}
function simPay(v,e,lid){
  const saved=S.leaves;S.leaves=Object.assign({},saved);if(lid)delete S.leaves[lid];S.leaves.__sim=Object.assign({},v,{id:'__sim',status:'approved'});Sv++;
  let m;try{m=fracs(e.id)}finally{S.leaves=saved;Sv++}
  let f=0,h=0,u=0;counted(v,e).forEach(d=>{const x=(m[d]||{f:1}).f;x===1?f++:x===0?u++:h++});
  return{f,h,u,ded:r2((h*.5+u)*gross(e)/30)}}
function leaveCheck(v,e,lid){
  const t=LT[v.type]||{},w=[],info=[];
  if(!v.from||!v.to)return{info:['Choose the dates.'],w};
  if(v.to<v.from)return{info,w:['The end date is before the start date.']};
  const c=counted(v,e),work=t.basis==='work'||(v.type==='annual'&&ST().annualBasis==='work');
  info.push(`<b>${c.length}</b> ${work?'working':'calendar'} day${c.length===1?'':'s'} · back at work <b>${fmtD(backDate(v,e))}</b>`);
  if(!canTake(v.type,e))w.push('Maternity leave is available to married female employees.');
  if(v.type==='annual'){const b=annualBal(e,v.from),own=lid&&S.leaves[lid]&&['approved','pending'].includes(S.leaves[lid].status)&&S.leaves[lid].type==='annual'?counted(S.leaves[lid],e).length:0,avail=r2(b.bal+own);
    info.push(`Annual leave available: ${avail} day${avail===1?'':'s'}`);
    if(c.length>avail)w.push('More days than the annual leave balance — the extra days would be unpaid.');
    if(netService(e,v.from)<183)w.push('Annual leave is earned after 6 months of service.')}
  if(v.type==='sick'){if(inProb(e,v.from))w.push('Sick leave during probation is unpaid (Art. 31).');info.push(`Sick days already used this service year: ${sickUsed(e,v.from)} of 90`)}
  if(v.type==='maternity'&&c.length>60)w.push('Maternity leave is 60 days: 45 at full pay and 15 at half pay.');
  if(v.type==='comp'){const b=compBal(e,lid);info.push(`Compensatory days available: ${b.bal}`);if(c.length>b.bal)w.push(b.cr?`Only ${b.bal} compensatory day${b.bal===1?'':'s'} available.`:'No compensatory days credited yet. HR credits them when you work on a rest day or public holiday.')}
  if(c.length){const p=simPay(v,e,lid);info.push('Pay: '+([p.f&&p.f+' full',p.h&&p.h+' half',p.u&&p.u+' unpaid'].filter(Boolean).join(', ')||'—')+(p.ded?` · estimated salary deduction AED ${aed(p.ded)}`:''))}
  const ov=Object.values(S.leaves).find(x=>x.id!==lid&&x.empId===e.id&&!['rejected','cancelled'].includes(x.status)&&x.from<=v.to&&x.to>=v.from);
  if(ov)w.push(`Overlaps another ${(LT[ov.type]||{n:'leave'}).n.toLowerCase()} (${fmtD(ov.from)} – ${fmtD(ov.to)}).`);
  return{info,w};
}

  openModal('Leave request',`<div class="row" style="gap:12px;margin:-4px 0 14px">${avatar(e,48)}<div><b>${esc(e.name)}</b><div class="small mut">${esc([e.code,e.designation,e.department,coName(e.companyId)].filter(Boolean).join(' · '))}</div></div></div>

    <h3 style="margin:14px 0 6px">Also off on these dates</h3>${others.length?`<ul class="alerts">${others.map(({x,o})=>`<li><span>${esc(o.name)}${o.department?` <span class="small mut">· ${esc(o.department)}</span>`:''}</span><span class="small">${fmtD(x.from)} – ${fmtD(x.to)} ${stTag(x.status)}</span></li>`).join('')}</ul>`:'<p class="small mut">Nobody else in this company is off on these dates.</p>'}
    ${l.status==='pending'?`<label class="f" style="margin-top:14px">Note to the employee <span class="mut">(required when rejecting)</span><textarea id="rvNote" maxlength="300" placeholder="e.g. Peak season — please choose dates after 15 January.">${esc(l.hrNote||'')}</textarea></label><div id="rvErr" class="warnl"></div>`:`<p style="margin-top:12px">${stTag(l.status)} ${l.decided?'<span class="small mut">on '+fmtD(l.decided)+'</span>':''}</p>${hrNoteHTML(l)}`}`,
    `<button class="btn" data-act="leaveNew" data-id="${esc(l.id)}">Edit</button>${l.status==='pending'?'<button class="btn del" id="rvRej">Reject</button><button class="btn pri" id="rvOk">Approve</button>':''}`);
  if(l.status!=='pending')return;
  const decide=async s=>{const note=$('#rvNote').value.trim();if(s==='rejected'&&note.length<3){$('#rvErr').textContent='Write the reason for rejecting — the employee will see it.';$('#rvNote').focus();return}

/* ---------- portal logins (admin) ---------- */
let secAuth=null;
async function makeAccount(email,pw){if(!secAuth)secAuth=getAuth(initializeApp(firebaseConfig,'account-creator'));const c=await createUserWithEmailAndPassword(secAuth,email,pw);const id=c.user.uid;await signOut(secAuth);return id}
const genPw=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',r=new Uint32Array(10);crypto.getRandomValues(r);return Array.from(r,x=>a[x%a.length]).join('')};
const loginOf=empId=>Object.values(S.users).find(u=>u.empId===empId&&u.role==='employee');
const nextName=n=>{const m=/^(.*)-(\d+)$/.exec(n);return m?m[1]+'-'+(+m[2]+1):n+'-2'};
const authErr=e=>{const c=String(e&&e.code);return/email-already-in-use/.test(c)?'That username is already taken.':/weak-password/.test(c)?'Password is too weak (at least 6 characters).':/operation-not-allowed/.test(c)?'Enable Email/Password sign-in in Firebase Authentication first.':/invalid-email/.test(c)?'Username can use only letters, numbers, dots, dashes and underscores.':'Could not create the login ('+c+').'};
function showCreds(name,un,pw){const url=location.origin+location.pathname,txt=`${APP_NAME}\nLink: ${url}\nUsername: ${un}\nPassword: ${pw}\nPlease change your password after first sign-in (My profile).`;
  openModal('Login created',`<p>Give these details to <b>${esc(name)}</b> privately. The password is not shown again.</p><textarea readonly style="min-height:130px;font-family:ui-monospace,monospace">${esc(txt)}</textarea>`,`<button class="btn pri" id="crCopy">Copy</button>`);
  $('#crCopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){toast('Select the text and copy it')}}}
ACT.login=d=>{
  const e=S.employees[d.id];if(!e)return;const cur=loginOf(d.id);
  const sugg=cur?nextName(cur.username||''):String(e.code||e.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  openModal('Portal login — '+e.name,`${cur?`<p>Current username: <b>${esc(cur.username)}</b> ${cur.active===false?'<span class="tag bad">disabled</span>':'<span class="tag ok">active</span>'}</p><p class="small mut">To reset a forgotten password, issue new credentials: a new username and password are created and the old login stops working. Employees can change their own password under My profile.</p>`:'<p>Create a username and password for this employee. They will see only their own leave, payslips and profile.</p>'}
   <div class="form" id="lgf"><label class="f"><span class="req">Username</span><input data-k="username" value="${esc(sugg)}" autocomplete="off"></label><label class="f"><span class="req">Temporary password</span><input data-k="pw" value="${genPw()}" autocomplete="off"></label></div><div id="lgErr" class="warnl"></div>`,
   `${cur?`<button class="btn" id="lgToggle">${cur.active===false?'Enable login':'Disable login'}</button>`:''}<button class="btn" data-act="close">Close</button><button class="btn pri" id="lgCreate">${cur?'Issue new credentials':'Create login'}</button>`);
  if(cur)$('#lgToggle').onclick=async()=>{try{await put('users',Object.assign(clean(cur),{active:cur.active===false}));closeModal();toast(cur.active===false?'Login enabled':'Login disabled')}catch(x){}};
  $('#lgCreate').onclick=async()=>{const v=readForm($('#lgf')),un=String(v.username).toLowerCase();
    if(!/^[a-z0-9._-]{3,40}$/.test(un)){$('#lgErr').textContent='Username: 3–40 characters, letters, numbers, dot, dash or underscore.';return}
    if(String(v.pw).length<8){$('#lgErr').textContent='Password needs at least 8 characters.';return}
    $('#lgCreate').disabled=true;$('#lgErr').textContent='Creating…';
    try{const id=await makeAccount(userEmail(un),v.pw);
      await put('users',{id,role:'employee',empId:e.id,username:un,active:true,created:today(),createdBy:ME.uid});

      showCreds(e.name,un,v.pw)}
    catch(x){$('#lgErr').textContent=x&&x.code&&String(x.code).startsWith('auth/')?authErr(x):'Saved the login but could not link it: '+errMsg(x);$('#lgCreate').disabled=false}};
};

  return`<div class="ph"><h1>Portal logins</h1><button class="btn" data-act="adminNew">Add HR admin</button></div>
  <p class="small mut">${noLogin} current employee${noLogin===1?'':'s'} without a login. Open an employee and choose <b>Portal login</b> to create one.</p>
  <div class="panel">${us.length?`<div class="scroll"><table class="stack"><thead><tr><th>Username</th><th>Role</th><th>Employee</th><th>Company</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody>${us.map(u=>{const e=S.employees[u.empId]||{};return`<tr><td><b>${esc(u.username)}</b></td><td>${u.role==='admin'?'HR admin':'Employee'}</td><td>${esc(e.name||'—')}</td><td>${esc(u.empId?coName(e.companyId):'All')}</td><td>${fmtD(u.created)}</td><td>${u.active===false?'<span class="tag bad">disabled</span>':'<span class="tag ok">active</span>'}</td><td>${u.id===ME.uid?'<span class="small mut">you</span>':`<button class="btn sm" data-act="userToggle" data-id="${esc(u.id)}">${u.active===false?'Enable':'Disable'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No logins yet.</div>'}</div>
  <div class="panel small mut">Disabling a login blocks it immediately through the database rules. HR admins see every company; employees see only their own record, leave requests and payslips.</div>`;
};
ACT.userToggle=async d=>{const u=S.users[d.id];if(!u)return;try{await put('users',Object.assign(clean(u),{active:u.active===false}));toast(u.active===false?'Enabled':'Disabled')}catch(e){}};
ACT.adminNew=()=>{
  openModal('Add HR admin',`<p class="small">HR admins can see and change all companies, salaries and documents. Use their real work email so they can reset their own password.</p><div class="form" id="adf"><label class="f"><span class="req">Work email</span><input data-k="email" type="email"></label><label class="f"><span class="req">Temporary password</span><input data-k="pw" value="${genPw()}"></label></div><div id="adErr" class="warnl"></div>`,
   `<button class="btn" data-act="close">Cancel</button><button class="btn pri" id="adGo">Create admin</button>`);
  $('#adGo').onclick=async()=>{const v=readForm($('#adf')),em=String(v.email).toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('#adErr').textContent='Enter a valid email.';return}if(String(v.pw).length<8){$('#adErr').textContent='Password needs at least 8 characters.';return}
    $('#adGo').disabled=true;try{const id=await makeAccount(em,v.pw);await put('users',{id,role:'admin',username:em,active:true,created:today(),createdBy:ME.uid});showCreds(em,em,v.pw)}catch(x){$('#adErr').textContent=x&&String(x.code).startsWith('auth/')?authErr(x):errMsg(x);$('#adGo').disabled=false}};
};
ACT.logout=async()=>{if(!auth)return;try{await signOut(auth)}catch(e){}
  if(STANDALONE){try{await terminate(fdb);await clearIndexedDbPersistence(fdb)}catch(e){}location.reload()}};
const touch=()=>{try{return matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0||'ontouchstart' in window}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let installEvt=null;
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installEvt=ev;schedule()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('CityCube HR installed');schedule()});
function installCard(always){
  if(STANDALONE)return'';
  if(!always){try{if(localStorage.getItem('hr-install-x'))return''}catch(e){}}
  const x=always?'':'<button class="btn sm" data-act="installX">Not now</button>';
  if(installEvt)return`<div class="panel install"><div><b>Install the CityCube HR app</b><div class="small mut">Open it from your home screen like any other app.</div></div><div class="row"><button class="btn pri" data-act="install">Install app</button>${x}</div></div>`;
  if(isIOS())return`<div class="panel install"><div><b>Add CityCube HR to your iPhone</b><div class="small mut">In Safari, tap the Share button (square with an arrow), then <b>Add to Home Screen</b>.</div></div>${x}</div>`;
  if(/android/i.test(navigator.userAgent))return`<div class="panel install"><div><b>Add CityCube HR to your phone</b><div class="small mut">In Chrome, open the menu ⋮ and tap <b>Install app</b> or <b>Add to Home screen</b>.</div></div>${x}</div>`;
  return always?`<div class="panel small mut">Tip: open this page on your phone and add it to the home screen to use CityCube HR as an app.</div>`:'';
}
ACT.install=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()};
ACT.installX=()=>{try{localStorage.setItem('hr-install-x','1')}catch(e){}render()};
window.addEventListener('offline',()=>setBanner('You\u2019re offline — showing the last saved information. Changes need an internet connection.'));
window.addEventListener('online',()=>setBanner(''));
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
ACT.seed=async()=>{if(cos().length)return;
  const cs=[['citycube-wh','CityCube Warehousing & Storage Management & Operation LLC','CityCube Warehousing','LLC','mainland'],['citycube-gt','CityCube General Trading FZ LLC','CityCube Trading','FZ-LLC','freezone'],['wahid-karak','Wahid Karak Cafe LLC','Wahid Karak Cafe','LLC','mainland']];
  try{for(const[i,c]of cs.entries())await put('companies',{id:c[0],name:c[1],short:c[2],form:c[3],zone:c[4],emirate:'Dubai',wps:true,weekend:[0,6],order:i+1});
    if(!S.settings.main)await put('settings',Object.assign({},DEF,{id:'main',holidays:[{date:'2026-12-02',name:'Eid Al Etihad (National Day)'},{date:'2026-12-03',name:'Eid Al Etihad (National Day)'},{date:'2027-01-01',name:'New Year’s Day'},{date:'2027-03-09',name:'Eid Al Fitr',expected:true},{date:'2027-03-10',name:'Eid Al Fitr',expected:true},{date:'2027-03-11',name:'Eid Al Fitr',expected:true},{date:'2027-05-15',name:'Arafat Day',expected:true},{date:'2027-05-16',name:'Eid Al Adha',expected:true},{date:'2027-05-17',name:'Eid Al Adha',expected:true},{date:'2027-05-18',name:'Eid Al Adha',expected:true}]}));
    toast('Companies created — add licence and WPS details under Companies')}catch(e){}};

/* events */
ACT.close=()=>closeModal();
ACT.co=d=>setCO(d.id);
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;if(b.tagName!=='A'||b.dataset.act==='close')ev.preventDefault();if(b.dataset.act==='goSettle'){f(b.dataset);location.hash='settlement';route();return}f(b.dataset,b,ev)});

</script>
